name: Daily scrape

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: data/processed/summary.json
      - id: check
        run: |
          today=$(date -u +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && grep -q "\"date\": \"$today\"" data/processed/summary.json; then
            echo "Already ran today ($today), skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  scrape:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests beautifulsoup4 pandas cryptography

      - name: Scrape hellojob.az
        run: python src/scraper.py --delay 0.7

      - name: Scrape boss.az
        continue-on-error: true
        run: python src/boss_scraper.py

      - name: Scrape busy.az
        continue-on-error: true
        run: python src/busy_scraper.py --delay 0.7

      - name: Update dataset
        run: python src/build_dataset.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/processed
          git diff --cached --quiet || git commit -m "Data update $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done

      - name: Notify Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/notify_telegram.py

      - name: Personal alerts
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_STATE_KEY: ${{ secrets.BOT_STATE_KEY }}
        run: |
          python src/bot.py digest
          git add data/bot_state.enc
          git diff --cached --quiet && exit 0
          git commit -m "Bot state update"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
