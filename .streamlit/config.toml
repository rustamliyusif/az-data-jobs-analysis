[theme.light]
primaryColor = "#0E6E74"
backgroundColor = "#F5F8F8"
secondaryBackgroundColor = "#E6EEEE"
textColor = "#14232B"
borderColor = "#D2DCDE"

[theme.dark]
primaryColor = "#36B3B8"
