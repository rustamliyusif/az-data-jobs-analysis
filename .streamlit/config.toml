[server]
enableStaticServing = true

[theme]
font = "Onest, sans-serif"
headingFont = "Unbounded, sans-serif"
baseRadius = "medium"
showWidgetBorder = true

[[theme.fontFaces]]
family = "Onest"
url = "app/static/fonts/onest-cyrillic-wght-normal.woff2"
weight = "100 900"
style = "normal"
unicodeRange = "U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116"

[[theme.fontFaces]]
family = "Onest"
url = "app/static/fonts/onest-latin-ext-wght-normal.woff2"
weight = "100 900"
style = "normal"
unicodeRange = "U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF"

[[theme.fontFaces]]
family = "Onest"
url = "app/static/fonts/onest-latin-wght-normal.woff2"
weight = "100 900"
style = "normal"
unicodeRange = "U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD"

[[theme.fontFaces]]
family = "Unbounded"
url = "app/static/fonts/unbounded-cyrillic-wght-normal.woff2"
weight = "200 900"
style = "normal"
unicodeRange = "U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116"

[[theme.fontFaces]]
family = "Unbounded"
url = "app/static/fonts/unbounded-latin-ext-wght-normal.woff2"
weight = "200 900"
style = "normal"
unicodeRange = "U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF"

[[theme.fontFaces]]
